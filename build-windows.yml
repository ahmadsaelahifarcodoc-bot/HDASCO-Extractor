name: Build HDASCO Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name HDASCO_Extractor main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDASCO_Extractor_Windows_x64
          path: dist/HDASCO_Extractor.exe
          if-no-files-found: error
          retention-days: 30
